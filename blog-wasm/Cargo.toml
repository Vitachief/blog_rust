[package]
name = "blog-wasm"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = [
    "Window",
    "Storage",
    "console",
    "HtmlInputElement",
    "HtmlElement",
    "Document",
    "EventTarget"
] }

# HTTP-клиент, специально разработанный для WASM (заменяет reqwest)
gloo-net = "0.4"

serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde-wasm-bindgen = "0.6"